name: Verificar AniDark

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Aceder ao addon
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 20 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 15 \
            "https://darknews13-anidark.hf.space/healthz"
